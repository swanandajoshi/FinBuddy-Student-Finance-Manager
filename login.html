<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login | FinBuddy</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>


<main class="login-bg d-flex align-items-center min-vh-100 py-4"><div class="container"><div class="row justify-content-center"><div class="col-md-8 col-lg-5">
<div class="text-center mb-3"><a href="index.html" class="h3 fw-bold text-white text-decoration-none"><i class="bi bi-wallet2"></i> FinBuddy</a></div>
<div class="card fb-card shadow-lg"><div class="card-body p-4">
<input type="radio" name="tab" id="t1" class="d-none" checked><input type="radio" name="tab" id="t2" class="d-none">
<div class="row text-center mb-3 tabs"><label for="t1" class="col py-2 fw-semibold lab1">Login</label><label for="t2" class="col py-2 fw-semibold lab2">Sign Up</label></div>
<form action="dashboard.html" class="form1">
<div class="mb-3"><label class="form-label">College Email</label><div class="input-group"><span class="input-group-text"><i class="bi bi-envelope"></i></span><input type="email" class="form-control" placeholder="name@rbunagpur.in" required></div></div>
<div class="mb-3"><label class="form-label">Password</label><div class="input-group"><span class="input-group-text"><i class="bi bi-lock"></i></span><input type="password" class="form-control" placeholder="Enter password" required></div></div>
<div class="form-check mb-3"><input class="form-check-input" type="checkbox" id="rem"><label class="form-check-label" for="rem">Remember me</label></div>
<button class="btn btn-fb w-100">Login</button></form>
<form action="dashboard.html" class="form2">
<div class="mb-3"><label class="form-label">Full Name</label><input type="text" class="form-control" placeholder="Your name" required></div>
<div class="mb-3"><label class="form-label">Roll Number</label><input type="text" class="form-control" placeholder="e.g. 24XX001" required></div>
<div class="mb-3"><label class="form-label">College Email</label><input type="email" class="form-control" placeholder="name@rbunagpur.in" required></div>
<div class="mb-3"><label class="form-label">Monthly Allowance (&#8377;)</label><input type="number" class="form-control" placeholder="8000" required></div>
<div class="mb-3"><label class="form-label">Password</label><input type="password" class="form-control" placeholder="Create password" required></div>
<button class="btn btn-fb w-100">Create Account</button></form>
</div></div></div></div></div></main>

</body>
</html>
